name: Pull request checks

on:
  pull_request:

env:
  CGO_ENABLED: "0"

permissions:
  contents: read

jobs:
  checks:
    name: Tidy, format, fix, vulnerabilities, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check that go mod tidy changes nothing
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check that go fmt changes nothing
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt would change these files:"
            echo "$files"
            gofmt -d .
            exit 1
          fi

      - name: Check that go fix changes nothing
        run: |
          go fix ./...
          git diff --exit-code

      - name: Check for vulnerable packages
        run: govulncheck ./...

      - name: Run the unit tests
        run: go test ./...
